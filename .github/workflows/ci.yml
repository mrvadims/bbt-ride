name: CI
# Pushes only: a pull request from a branch here shows these results, so it needn't run them twice.
on:
  push:
    branches-ignore: [main] # main runs the same checks in deploy.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
