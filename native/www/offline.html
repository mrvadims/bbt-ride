<!doctype html>
<!-- Shown by the Android app when app.bbt.team can't be reached (capacitor.config.ts → server.errorPath). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BBT · No connection</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0077d1;
        color: #fff;
        font: 16px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        opacity: 0.9;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 12px 28px;
        background: #fff;
        color: #0077d1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>BBT needs the internet. Check your connection and try again.</p>
      <button type="button" onclick="location.href = 'https://app.bbt.team/'">Retry</button>
    </main>
  </body>
</html>
